<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Retro VCR</title>

    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        background-color: #000;
        overflow-x: hidden;
        overflow-y: auto;
        scroll-snap-type: y mandatory;
        scrollbar-width: none;
    }

    ::-webkit-scrollbar {
        display: none;
    }

    /* Cada prancheta/slide */
    .slide-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        scroll-snap-align: start;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    /* Imagem de fundo da Prancheta */
    .bg-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
    }

    /* Mídia sobreposta (Contêiner para Vídeos e Fotos) */
    .media-overlay {
        position: absolute;
        bottom: 5vh;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 1400px;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 15px;
        padding: 10px;
    }

    /* Estilo padrão para todos os vídeos e fotos flutuantes */
    .media-overlay video,
    .media-overlay img {
        border-radius: 1rem;
        border: 2px solid #ffffff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        object-fit: cover;
        background-color: #000;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        /* Tamanho responsivo usando clamp(mínimo, ideal, máximo) */
        width: clamp(140px, 15vw, 220px);
        height: auto;
        aspect-ratio: 9 / 16; /* Mantém a proporção padrão vertical de mídias de social media */
    }

    /* Variação de tamanho maior para itens específicos (como na Prancheta 5) */
    .media-overlay.large-items video,
    .media-overlay.large-items img {
        width: clamp(180px, 20vw, 280px);
    }

    /* Efeito ao passar o mouse */
    .media-overlay video:hover,
    .media-overlay img:hover {
        transform: translateY(-5px) scale(1.03);
        box-shadow: 0 12px 25px rgba(255, 255, 255, 0.2);
    }

    /* AJUSTES RESPONSIVOS PARA SMARTPHONES E TABLETS */
    @media (max-width: 768px) {
        .slide-container {
            height: 100vh;
            overflow-y: auto;
        }

        .media-overlay {
            bottom: 2vh;
            width: 95%;
            gap: 10px;
            max-height: 60vh;
            overflow-y: auto; /* Permite scroll interno caso existam muitos itens */
        }

        .media-overlay video,
        .media-overlay img,
        .media-overlay.large-items video,
        .media-overlay.large-items img {
            width: calc(50% - 10px); /* 2 itens por linha no celular */
            aspect-ratio: auto;
        }
    }

    @media (max-width: 480px) {
        .media-overlay video,
        .media-overlay img,
        .media-overlay.large-items video,
        .media-overlay.large-items img {
            width: 100%; /* 1 item por linha em telas muito pequenas */
            max-width: 260px;
        }
    }
    </style>
</head>

<body>

    <!-- PRANCHETA 1 -->
    <div class="slide-container">
        <img class="bg-image" src="Prancheta 1.jpg" alt="Capa">
    </div>

    <!-- PRANCHETA 2 -->
    <div class="slide-container">
        <img class="bg-image" src="Prancheta 2.jpg" alt="Sobre Mim">
    </div>

    <!-- PRANCHETA 3 -->
    <div class="slide-container">
        <img class="bg-image" src="Prancheta 3.jpg" alt="Habilidades">
    </div>

    <!-- PRANCHETA 4: PROJETOS -->
    <div class="slide-container">
        <img class="bg-image" src="Prancheta 4.jpg" alt="PROJETOS">
        <div class="media-overlay">
            <img id="foto2" src="PETISQUINHO.png" alt="Foto 2">
            <img id="foto3" src="BOBBY.jpg" alt="Foto 3">
            <img id="foto1" src="Sem Título-2-1.jpg" alt="Foto 1">
            <video controls autoplay muted loop id="video2">
                <source src="PETS.mp4" type="video/mp4">
            </video>
            <video controls autoplay muted loop id="bgvideo">
                <source src="PORQUE ELES DORMEM TANTO.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <!-- PRANCHETA 5 -->
    <div class="slide-container">
        <img class="bg-image" src="prancheta-5.jpg" alt="Meus Projetos">
        <div class="media-overlay large-items">
            <video controls autoplay muted loop id="bgvideo2">
                <source src="TRABALHO FOCADO.mp4" type="video/mp4">

            <img id="foto6" src="produtividade.jpg" alt="Foto 6">

            <img id="foto7" src="PARA-UMA-MELHOR-PERFORMANCE.jpg" alt="Foto 7">

    </div>

    <!-- PRANCHETA 6 -->

            <video controls autoplay muted loop id="video5">
                <source src="DEEP WORK  mp4.mp4" type="video/mp4">

        </div>
    </div>

</body>
</html>
